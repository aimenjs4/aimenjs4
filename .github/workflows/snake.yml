name: profile
on:
  push:
  workflow_dispatch:
  schedule: [{ cron: "0 0 * * *" }]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: show_icons=true&theme=github_dark&hide_border=true&title_color=00d4aa&icon_color=00d4aa&ring_color=00d4aa
          path: dist/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: layout=donut&theme=github_dark&hide_border=true&title_color=00d4aa
          path: dist/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=#f0a500&color_dots=#161b22,#004d40,#00806a,#00aa8b,#00d4aa
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
